[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[project]
name = 'hjlib-evaluation'
version = '0.1.0'
description = 'Human reconstruction evaluation protocols, owning model-neutral paired validation metrics, GT adapters, dump/inference orchestration, and sufficient-statistic reduction without model or dataset definitions.'
requires-python = '>=3.12'
dependencies = [
    'numpy',
    'scipy',
    'torch',
    'tqdm',
    'typer>=0.12,<1.0',
]

[tool.hatch.build.targets.wheel]
packages = ['src/hjlib_evaluation']

[tool.pytest.ini_options]
testpaths = ['test_smoke', 'test']

# Pinned internal deps (Phase 1-5): the testset/GT layers import hjlib-dataset-assembly
# (Dataset factory + filter store) + hjlib-dataset-std (JTA raw 22-joint GT) +
# hjlib-skeleton (JTA-22 -> SMPL-54 name map) + hjlib-geometry (corrected
# point-registration fits and ray-plane intersection) + hjlib-detection
# (Tracked_Scene protocol) + hjlib-ground-solver (RCR baseline) + hjlib-filesystem-atomic
# (atomic no-replace directory publication).
# hjlib-network / hjlib-smpl remain deferred.
[tool.hjlibm]
description_updated = '2026-10-08'

[tool.hjlibm.deps]
hjlib-camera = { path = '../hjlib-camera', commit = "e936c5538b575b54e629402c4dc590d130be7b8b" }
hjlib-dataset-assembly = { path = '../hjlib-dataset-assembly', commit = "591f003e98f6578e7e711874872584562acde0d5" }
hjlib-dataset-std = { path = '../hjlib-dataset-std', commit = "6b6c928f5c3af4042aefa4ae0bdb1826f5f19e1a" }
hjlib-detection = { path = '../hjlib-detection', commit = "c6eb20622755ee7a703a49df12388e1176a1d140" }
hjlib-geometry = { path = '../hjlib-geometry', commit = "26da454a2d2b2a9decddfd560b0b19317fc2b625" }
hjlib-ground-solver = { path = '../hjlib-ground-solver', commit = "bc72ce987d36ee82c85c3f7054b816db177b3b96" }
hjlib-meshes = { path = '../hjlib-meshes', commit = "959b4a50923657fa927b9dfd188119ae05775449" }
hjlib-skeleton = { path = '../hjlib-skeleton', commit = "72bec37abeefda708cf9eedfdd2217075758045b" }
hjlib-filesystem-atomic = { path = '../hjlib-filesystem-atomic', commit = "416c0094c72d9b03d99ca48b2723a16faf74da92" }
