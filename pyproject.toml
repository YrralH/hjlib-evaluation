[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[project]
name = 'hjlib-evaluation'
version = '0.1.0'
description = 'Evaluation protocol harness for dynamic-scene human pose predictions, owning GT adapters, dump/inference orchestration, GT-track sufficient statistics and metric reduction without model or dataset definitions.'
requires-python = '>=3.12'
dependencies = [
    'numpy',
    'scipy',
    'torch',
    'tqdm',
    'typer>=0.12,<1.0',
]

[tool.hatch.build.targets.wheel]
packages = ['src/hjlib_evaluation']

[tool.pytest.ini_options]
testpaths = ['test_smoke', 'test']

# Pinned internal deps (Phase 1-5): the testset/GT layers import hjlib-dataset-assembly
# (Dataset factory + filter store) + hjlib-dataset-std (JTA raw 22-joint GT) +
# hjlib-skeleton (JTA-22 -> SMPL-54 name map) + hjlib-geometry (corrected
# point-registration fits and ray-plane intersection) + hjlib-detection
# (Tracked_Scene protocol) + hjlib-ground-solver (RCR baseline) + hjlib-systools
# (atomic no-replace directory publication).
# hjlib-network / hjlib-smpl remain deferred.
[tool.hjlibm]
description_updated = '2026-09-07'

[tool.hjlibm.deps]
hjlib-camera = { path = '../hjlib-camera', commit = "a0071f8cc045d759f9c649f472ed198c2d61d04e" }
hjlib-dataset-assembly = { path = '../hjlib-dataset-assembly', commit = "5235398a358a9432666572abf544ee5d1077796a" }
hjlib-dataset-std = { path = '../hjlib-dataset-std', commit = "3bf33ea992d81a99c1dcf2323561506d2dc83c66" }
hjlib-detection = { path = '../hjlib-detection', commit = "0c9de105998d9c78ca9d22f13a974eda326b2233" }
hjlib-geometry = { path = '../hjlib-geometry', commit = "1845f9747bfd5778d804f280a17f7341f440e67b" }
hjlib-ground-solver = { path = '../hjlib-ground-solver', commit = "34b2c0d43d00424d070b1022b26d7d529ea67b77" }
hjlib-meshes = { path = '../hjlib-meshes', commit = "359b163db69a57c9536fbccc74a260e3240a580e" }
hjlib-skeleton = { path = '../hjlib-skeleton', commit = "72bec37abeefda708cf9eedfdd2217075758045b" }
hjlib-systools = { path = '../hjlib-systools', commit = "bddb98e67504537bdec556075cea4053025f6c84" }
