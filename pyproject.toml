[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[project]
name = 'hjlib-evaluation'
version = '0.1.0'
description = 'Evaluation protocol harness for dynamic-scene human pose predictions, owning testset construction, dataset GT adapters, dump/inference orchestration, and metric reduction without model or dataset definitions.'
requires-python = '>=3.12'
dependencies = [
    'numpy',
    'torch',
    'tqdm',
    'typer>=0.12,<1.0',
]

[tool.hatch.build.targets.wheel]
packages = ['src/hjlib_evaluation']

[tool.pytest.ini_options]
testpaths = ['test_smoke', 'test']

# Pinned internal deps (Phase 1-5): the testset/GT layers import hjlib-dataset-assembly
# (Dataset factory + filter store) + hjlib-dataset-std (JTA raw 22-joint GT) +
# hjlib-skeleton (JTA-22 -> SMPL-54 name map). hjlib-network / hjlib-smpl / hjlib-geometry
# are NOT pinned: the eval-on-dumps path + the verbatim-numpy reducer import none of them;
# they land with the deferred live network_driver (DIV-10) / 2D-OKS metrics.
[tool.hjlibm]
description_updated = '2026-07-01'

[tool.hjlibm.deps]
hjlib-dataset-assembly = { path = '../hjlib-dataset-assembly', commit = "3b80a0f7c72e3ec261caffadd0a4460555b8ac12" }
hjlib-dataset-std = { path = '../hjlib-dataset-std', commit = "803cac9aebf1ec8c0e7c51834419a20e84de2d8e" }
hjlib-skeleton = { path = '../hjlib-skeleton', commit = "a69c1487821378ad363d94b145403f63a3c5f54f" }
