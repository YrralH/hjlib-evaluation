[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[project]
name = 'hjlib-evaluation'
version = '0.1.0'
description = 'Evaluation protocol harness for dynamic-scene human pose predictions, owning testset construction, dataset GT adapters, dump/inference orchestration, and metric reduction without model or dataset definitions.'
requires-python = '>=3.12'
dependencies = [
    'hjlib-camera',
    'hjlib-meshes',
    'numpy',
    'scipy',
    'torch',
    'tqdm',
    'typer>=0.12,<1.0',
]

[tool.hatch.build.targets.wheel]
packages = ['src/hjlib_evaluation']

[tool.pytest.ini_options]
testpaths = ['test_smoke', 'test']

# Pinned internal deps (Phase 1-5): the testset/GT layers import hjlib-dataset-assembly
# (Dataset factory + filter store) + hjlib-dataset-std (JTA raw 22-joint GT) +
# hjlib-skeleton (JTA-22 -> SMPL-54 name map) + hjlib-geometry (corrected
# point-registration fits and ray-plane intersection) + hjlib-detection
# (Tracked_Scene protocol) + hjlib-ground-solver (RCR baseline).
# hjlib-network / hjlib-smpl remain deferred.
[tool.hjlibm]
description_updated = '2026-08-19'

[tool.hjlibm.deps]
hjlib-camera = { path = '../hjlib-camera', commit = "a0071f8cc045d759f9c649f472ed198c2d61d04e" }
hjlib-dataset-assembly = { path = '../hjlib-dataset-assembly', commit = "c56ca6a3fa2cef28021ca31f38cea07fb79eed0e" }
hjlib-dataset-std = { path = '../hjlib-dataset-std', commit = "3186439271bd4861ffe337a1f67c71e98b59b41a" }
hjlib-detection = { path = '../hjlib-detection', commit = "104e18a5ed894f84854ef8e19e9c8d47af1a3b48" }
hjlib-geometry = { path = '../hjlib-geometry', commit = "6ebc8ed2d59c5a0f4d622ca0e916dfb9241d47ee" }
hjlib-ground-solver = { path = '../hjlib-ground-solver', commit = "4a8aa09307e2fed0310d696f9d32397f2681b774" }
hjlib-meshes = { path = '../hjlib-meshes', commit = "359b163db69a57c9536fbccc74a260e3240a580e" }
hjlib-skeleton = { path = '../hjlib-skeleton', commit = "713678e3e373f89cec182d65bbbf4920dda5216e" }
