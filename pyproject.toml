[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[project]
name = 'hjlib-evaluation'
version = '0.1.0'
description = 'Human reconstruction evaluation protocols, owning model-neutral paired validation metrics, GT adapters, dump/inference orchestration, and sufficient-statistic reduction without model or dataset definitions.'
requires-python = '>=3.12'
dependencies = [
    'numpy',
    'scipy',
    'torch',
    'tqdm',
    'typer>=0.12,<1.0',
]

[tool.hatch.build.targets.wheel]
packages = ['src/hjlib_evaluation']

[tool.pytest.ini_options]
testpaths = ['test_smoke', 'test']

# Pinned internal deps (Phase 1-5): the testset/GT layers import hjlib-dataset-assembly
# (Dataset factory + filter store) + hjlib-dataset-std (JTA raw 22-joint GT) +
# hjlib-skeleton (JTA-22 -> SMPL-54 name map) + hjlib-geometry (corrected
# point-registration fits and ray-plane intersection) + hjlib-detection
# (Tracked_Scene protocol) + hjlib-ground-solver (RCR baseline) + hjlib-filesystem-atomic
# (atomic no-replace directory publication).
# hjlib-network / hjlib-smpl remain deferred.
[tool.hjlibm]
description_updated = '2026-10-08'

[tool.hjlibm.deps]
hjlib-camera = { path = '../hjlib-camera', commit = "3cf3bd9b326fd7ea87657d5e50948b4ef33cdd05" }
hjlib-dataset-assembly = { path = '../hjlib-dataset-assembly', commit = "e8261dd23675e785edd3e92c3d31d19958014a6d" }
hjlib-dataset-std = { path = '../hjlib-dataset-std', commit = "d40636e98aa12d3ad6031f97bb22db269100625f" }
hjlib-detection = { path = '../hjlib-detection', commit = "0f9e78073a7b058b93b9334955b05f2e7ec4954e" }
hjlib-geometry = { path = '../hjlib-geometry', commit = "fe0d1a4fdff7ea7b9341218891b042aa9d30f7c3" }
hjlib-ground-solver = { path = '../hjlib-ground-solver', commit = "5dba0c0e4e43163a1b32d07e53725f1ed8bc7a46" }
hjlib-meshes = { path = '../hjlib-meshes', commit = "5a95ee377ecace471dedffdf65736f5916877133" }
hjlib-skeleton = { path = '../hjlib-skeleton', commit = "72bec37abeefda708cf9eedfdd2217075758045b" }
hjlib-filesystem-atomic = { path = '../hjlib-filesystem-atomic', commit = "a62e1ba2ffda7bba5411818045f1ef0afb643487" }
