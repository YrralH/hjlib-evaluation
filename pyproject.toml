[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[project]
name = 'hjlib-evaluation'
version = '0.1.0'
description = 'Evaluation protocol harness for dynamic-scene human pose predictions, owning testset construction, dataset GT adapters, dump/inference orchestration, and metric reduction without model or dataset definitions.'
requires-python = '>=3.12'
dependencies = [
    'numpy',
    'torch',
    'tqdm',
    'typer>=0.12,<1.0',
]

[tool.hatch.build.targets.wheel]
packages = ['src/hjlib_evaluation']

[tool.pytest.ini_options]
testpaths = ['test_smoke', 'test']

# Pinned internal deps (Phase 1-5): the testset/GT layers import hjlib-dataset-assembly
# (Dataset factory + filter store) + hjlib-dataset-std (JTA raw 22-joint GT) +
# hjlib-skeleton (JTA-22 -> SMPL-54 name map) + hjlib-geometry (corrected
# point-registration fits). hjlib-network / hjlib-smpl remain deferred.
[tool.hjlibm]
description_updated = '2026-07-01'

[tool.hjlibm.deps]
hjlib-dataset-assembly = { path = '../hjlib-dataset-assembly', commit = "11b55caa1f5fd3722abd558391aff7a0f5387b00" }
hjlib-dataset-std = { path = '../hjlib-dataset-std', commit = "32e85ac789b5063bc9f2e2d03e9853f1b5edda8c" }
hjlib-geometry = { path = '../hjlib-geometry', commit = "b4594ad1f71f14b8b969178ec61232a1595817c1" }
hjlib-skeleton = { path = '../hjlib-skeleton', commit = "a69c1487821378ad363d94b145403f63a3c5f54f" }
