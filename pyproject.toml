[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[project]
name = 'hjlib-evaluation'
version = '0.1.0'
description = 'Evaluation protocol harness for dynamic-scene human pose predictions, owning testset construction, dataset GT adapters, dump/inference orchestration, and metric reduction without model or dataset definitions.'
requires-python = '>=3.12'
dependencies = [
    'numpy',
    'scipy',
    'torch',
    'tqdm',
    'typer>=0.12,<1.0',
]

[tool.hatch.build.targets.wheel]
packages = ['src/hjlib_evaluation']

[tool.pytest.ini_options]
testpaths = ['test_smoke', 'test']

# Pinned internal deps (Phase 1-5): the testset/GT layers import hjlib-dataset-assembly
# (Dataset factory + filter store) + hjlib-dataset-std (JTA raw 22-joint GT) +
# hjlib-skeleton (JTA-22 -> SMPL-54 name map) + hjlib-geometry (corrected
# point-registration fits and ray-plane intersection) + hjlib-detection
# (Tracked_Scene protocol) + hjlib-ground-solver (RCR baseline).
# hjlib-network / hjlib-smpl remain deferred.
[tool.hjlibm]
description_updated = '2026-08-19'

[tool.hjlibm.deps]
hjlib-dataset-assembly = { path = '../hjlib-dataset-assembly', commit = "5a7c0b8c60e3ee8f4c8aa03bcebda66a0a3e0855" }
hjlib-dataset-std = { path = '../hjlib-dataset-std', commit = "b7915921319f9ebe8e4b2552368e9becc5cacdf9" }
hjlib-detection = { path = '../hjlib-detection', commit = "9587530be0571556645265f36cc02262fd02e5a2" }
hjlib-geometry = { path = '../hjlib-geometry', commit = "46981fb15090deb0c50735825dedba34fc598d26" }
hjlib-ground-solver = { path = '../hjlib-ground-solver', commit = "80c416d177ad8b878a7a0780e62c9654b3c0564d" }
hjlib-skeleton = { path = '../hjlib-skeleton', commit = "a69c1487821378ad363d94b145403f63a3c5f54f" }
