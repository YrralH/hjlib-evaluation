[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[project]
name = 'hjlib-evaluation'
version = '0.1.0'
description = 'Evaluation protocol harness for dynamic-scene human pose predictions, owning GT adapters, dump/inference orchestration, GT-track sufficient statistics and metric reduction without model or dataset definitions.'
requires-python = '>=3.12'
dependencies = [
    'numpy',
    'scipy',
    'torch',
    'tqdm',
    'typer>=0.12,<1.0',
]

[tool.hatch.build.targets.wheel]
packages = ['src/hjlib_evaluation']

[tool.pytest.ini_options]
testpaths = ['test_smoke', 'test']

# Pinned internal deps (Phase 1-5): the testset/GT layers import hjlib-dataset-assembly
# (Dataset factory + filter store) + hjlib-dataset-std (JTA raw 22-joint GT) +
# hjlib-skeleton (JTA-22 -> SMPL-54 name map) + hjlib-geometry (corrected
# point-registration fits and ray-plane intersection) + hjlib-detection
# (Tracked_Scene protocol) + hjlib-ground-solver (RCR baseline) + hjlib-systools
# (atomic no-replace directory publication).
# hjlib-network / hjlib-smpl remain deferred.
[tool.hjlibm]
description_updated = '2026-09-07'

[tool.hjlibm.deps]
hjlib-camera = { path = '../hjlib-camera', commit = "14d336b3ae7821b5739b57db846a4b474c53ebdc" }
hjlib-dataset-assembly = { path = '../hjlib-dataset-assembly', commit = "5ec86e0462996aafe461be4d99af17aa809ca2d2" }
hjlib-dataset-std = { path = '../hjlib-dataset-std', commit = "f81446813ea5b4c595a36b0b0b35afba75311133" }
hjlib-detection = { path = '../hjlib-detection', commit = "bd2196d3f42c38aaa50eee4a4ef9d573096939e0" }
hjlib-geometry = { path = '../hjlib-geometry', commit = "ea56bf8b001daa871defddf5e1d717fee3c8cd4c" }
hjlib-ground-solver = { path = '../hjlib-ground-solver', commit = "89ddaedcf2f94c6022c88ff577de75ae92a9d24b" }
hjlib-meshes = { path = '../hjlib-meshes', commit = "34b2ef3794364b726b12145ca06d7f6cd91a54b2" }
hjlib-skeleton = { path = '../hjlib-skeleton', commit = "72bec37abeefda708cf9eedfdd2217075758045b" }
hjlib-systools = { path = '../hjlib-systools', commit = "694ca16f0dbc38ab3e87ff01a3d8543fbcfed5ee" }
